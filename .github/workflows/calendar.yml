name: 营销节点自动刷新

on:
  schedule:
    - cron: '17 3 * * 1'   # 每周一 03:17 UTC（北京 11:17）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 拉取营销节点并固化
        run: |
          pip install lunardate
          python cal_fetch.py
      - name: 同步部署
        run: |
          git config user.name "brew-insight-bot"
          git config user.email "bot@brew-insight.com"
          cp coffee.html index.html
          git add coffee.html index.html
          git diff --cached --quiet || {
            git commit -m "📅 营销节点自动刷新 $(date +'%Y-%m-%d')"
            git push
          }