name: 资讯自动刷新

on:
  schedule:
    - cron: '17 2 */2 * *'   # 每 2 日 02:17 UTC（北京 10:17）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取资讯并自动部署（含营销节点+加密构建+提交推送）
        run: |
          pip install lunardate
          python tavily_refresh.py --deploy