<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="咖啡与茶饮行业情报站：品牌动态、菜单情报、营销节点、档期与产品力分析">
<meta name="theme-color" content="#0a0f18">
<meta property="og:title" content="饮力情报局 · 行业情报站">
<meta property="og:description" content="品牌动态 · 菜单情报 · 营销节点 · 档期分析">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
<title>饮力情报局</title>
<style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
    body { -webkit-overflow-scrolling: touch; touch-action: manipulation; }
    body {
      font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: #080c18;
      color: #e0e6f0;
      line-height: 1.6;
    }

    /* ── Layout ── */
    .app { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px; flex-shrink: 0;
      background: #0c1120;
      border-right: 1px solid rgba(59,130,246,.12);
      padding: 28px 20px;
      position: sticky; top: 0; height: 100vh;
      overflow-y: auto;
      display: flex; flex-direction: column;
      box-shadow: 2px 0 30px rgba(59,130,246,.04);
    }
    .sidebar-logo {
      font-size: 20px; font-weight: 800; letter-spacing: -.3px;
      display: flex; align-items: center; gap: 10px;
      padding-bottom: 24px; margin-bottom: 24px;
      border-bottom: 1px solid rgba(59,130,246,.1);
      color: #e0e6f0;
    }
    .sidebar-logo span { color: #60a5fa; }
    .sidebar-logo .badge {
      font-size: 9px; font-weight: 700; letter-spacing: .5px;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #fff;
      padding: 2px 8px; border-radius: 100px;
      margin-left: 4px;
      box-shadow: 0 0 12px rgba(59,130,246,.4);
    }
    .sidebar nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .sidebar nav a {
      padding: 10px 14px; border-radius: 10px;
      text-decoration: none; color: #8892a8; font-size: 14px; font-weight: 500;
      display: flex; align-items: center; gap: 10px;
      transition: all .2s;
    }
    .sidebar nav a:hover { background: rgba(59,130,246,.08); color: #e0e6f0; }
    .sidebar nav a.active {
      background: linear-gradient(135deg, rgba(59,130,246,.15), rgba(96,165,250,.08));
      color: #60a5fa;
      box-shadow: inset 0 0 20px rgba(59,130,246,.06);
    }
    .sidebar nav a .icon { font-size: 18px; width: 24px; text-align: center; }
    .sidebar-nav-label {
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
      color: #4a5568; margin: 16px 0 8px 14px; text-transform: uppercase;
    }

    .sidebar-footer {
      margin-top: auto; padding-top: 16px;
      border-top: 1px solid rgba(59,130,246,.1);
      font-size: 12px; color: #4a5568;
    }
    .sidebar-footer .user {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; border-radius: 10px;
      cursor: pointer; transition: background .2s;
    }
    .sidebar-footer .user:hover { background: rgba(59,130,246,.06); }
    .sidebar-footer .user-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px;
      box-shadow: 0 0 16px rgba(59,130,246,.3);
    }

    /* ── Main ── */
    .main {
      flex: 1; min-width: 0;
      padding: 32px 40px 60px;
      max-width: 1100px;
    }

    /* ── Top bar ── */
    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 28px; flex-wrap: wrap; gap: 12px;
    }
    .top-bar .tb-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .top-bar .tb-left .back-btn {
      display: none; font-size: 13px; color: #60a5fa; cursor: pointer;
      padding: 4px 10px; border-radius: 8px; flex-shrink: 0; text-decoration: none;
      background: rgba(59,130,246,.08); white-space: nowrap;
    }
    .top-bar .tb-left .back-btn:hover { background: rgba(59,130,246,.15); }
    .top-bar .tb-left .back-btn.visible { display: inline-block; }
    .top-bar h1 {
      font-size: 26px; font-weight: 800; letter-spacing: -.5px;
      color: #e0e6f0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .top-bar h1 small {
      font-size: 14px; font-weight: 400; color: #4a5568;
      margin-left: 12px;
    }
    .top-bar-actions {
      display: flex; align-items: center; gap: 12px;
    }
    .top-bar-actions .date-display {
      font-size: 13px; color: #8892a8; font-weight: 500;
      background: #0c1120; padding: 8px 16px; border-radius: 100px;
      border: 1px solid rgba(59,130,246,.12);
    }
    .btn-icon {
      width: 38px; height: 38px; border-radius: 10px;
      border: 1px solid rgba(59,130,246,.12); background: #0c1120;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 16px; color: #8892a8;
      transition: all .2s;
    }
    .btn-icon:hover { background: rgba(59,130,246,.1); border-color: #3b82f6; color: #60a5fa; }

    /* ── Hot Topic Hero ── */
    .hot-hero {
      background: linear-gradient(135deg, #0f1a2e 0%, #1a2740 50%, #0f1a2e 100%);
      border-radius: 20px;
      padding: 32px 36px;
      color: #e0e6f0;
      margin-bottom: 28px;
      position: relative; overflow: hidden;
      border: 1px solid rgba(59,130,246,.15);
      box-shadow: 0 0 40px rgba(59,130,246,.06), inset 0 0 60px rgba(59,130,246,.03);
    }
    .hot-hero::before {
      content: ''; position: absolute; top: -60%; right: -10%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(59,130,246,.12) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hot-hero::after {
      content: ''; position: absolute; bottom: -30%; left: 20%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(96,165,250,.06) 0%, transparent 70%);
      border-radius: 50%;
    }
    .hot-hero .label {
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: #60a5fa; margin-bottom: 8px;
      display: flex; align-items: center; gap: 8px;
    }
    .hot-hero .label .fire { font-size: 16px; }
    .hot-hero h2 {
      font-size: 22px; font-weight: 700; margin-bottom: 10px;
      position: relative; z-index: 1;
    }
    .hot-hero .meta {
      font-size: 13px; color: rgba(255,255,255,.5);
      display: flex; align-items: center; gap: 16px;
      position: relative; z-index: 1;
    }
    .hot-hero .meta .tag {
      background: rgba(59,130,246,.2); color: #60a5fa;
      padding: 2px 10px; border-radius: 100px; font-size: 11px; font-weight: 600;
    }
    .hot-hero .sources {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 14px;
      position: relative; z-index: 1;
    }
    .hot-hero .sources span {
      font-size: 11px; color: rgba(255,255,255,.35);
      background: rgba(255,255,255,.04);
      padding: 3px 10px; border-radius: 6px;
      border: 1px solid rgba(255,255,255,.04);
    }

    /* ── Filter tabs ── */
    .filter-bar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 20px; flex-wrap: wrap;
    }
    .filter-bar .filter-label {
      font-size: 12px; font-weight: 600; color: #4a5568;
      letter-spacing: .5px; text-transform: uppercase;
      margin-right: 4px;
    }
    .filter-btn {
      padding: 6px 16px; border-radius: 100px;
      border: 1px solid rgba(59,130,246,.12); background: #0c1120;
      font-size: 13px; font-weight: 500; color: #8892a8;
      cursor: pointer; transition: all .2s;
    }
    .filter-btn:hover { border-color: rgba(59,130,246,.3); color: #60a5fa; }
    .filter-btn.active {
      background: linear-gradient(135deg, #3b82f6, #60a5fa);
      color: #fff; border-color: transparent;
      box-shadow: 0 0 20px rgba(59,130,246,.25);
    }

    /* ── News card ── */
    .news-card {
      background: #0c1120;
      border-radius: 16px;
      padding: 24px 28px;
      margin-bottom: 16px;
      transition: all .25s;
      border: 1px solid rgba(59,130,246,.06);
      box-shadow: 0 1px 0 rgba(59,130,246,.04);
    }
    .news-card:hover {
      border-color: rgba(59,130,246,.15);
      box-shadow: 0 0 24px rgba(59,130,246,.06), 0 4px 20px rgba(0,0,0,.2);
    }
    .news-card .card-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 10px;
    }
    .news-card .brand-icon {
      width: 24px; height: 24px; border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; font-weight: 700; color: #fff;
      flex-shrink: 0;
    }
    .news-card .brand-name {
      font-size: 13px; font-weight: 600; color: #4a5568;
    }
    .news-card .time {
      font-size: 12px; color: #4a5568; margin-left: auto;
    }
    .news-card .score {
      font-size: 11px; font-weight: 700; color: #60a5fa;
      background: rgba(59,130,246,.1); padding: 2px 10px; border-radius: 100px;
      margin-left: 8px;
    }
    .news-card h3 {
      font-size: 17px; font-weight: 700;
      margin-bottom: 8px; line-height: 1.4;
    }
    .news-card h3 a {
      text-decoration: none; color: #e0e6f0;
    }
    .news-card h3 a:hover { color: #60a5fa; }
    .news-card p {
      font-size: 14px; color: #6b7a92;
      line-height: 1.7; margin-bottom: 12px;
    }
    .news-card .card-footer {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .news-card .tag {
      font-size: 11px; font-weight: 600;
      padding: 2px 10px; border-radius: 100px;
      background: rgba(59,130,246,.08); color: #8892a8;
    }
    .news-card .tag.tag-red { background: rgba(239,68,68,.12); color: #f87171; }
    .news-card .tag.tag-green { background: rgba(34,197,94,.12); color: #4ade80; }
    .news-card .tag.tag-blue { background: rgba(59,130,246,.12); color: #60a5fa; }
    .news-card .tag.tag-gold { background: rgba(234,179,8,.12); color: #facc15; }

    /* ── Section separator ── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin: 36px 0 16px;
    }
    .section-header h3 {
      font-size: 18px; font-weight: 700;
      color: #e0e6f0;
    }
    .section-header a {
      font-size: 13px; color: #60a5fa; text-decoration: none;
      font-weight: 500;
    }
    .section-header a:hover { text-decoration: underline; }

    /* ── Side right panel (in main) ── */
    .main-grid {
      display: grid; grid-template-columns: 1fr 300px; gap: 28px;
      align-items: start;
    }
    .main-content { min-width: 0; }
    .side-panel {
      position: sticky; top: 28px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      align-self: start;
    }
    .side-panel::-webkit-scrollbar { width: 4px; }
    .side-panel::-webkit-scrollbar-thumb { background: rgba(59,130,246,.15); border-radius: 2px; }

    /* ── Trend card ── */
    .trend-card {
      background: #0c1120; border-radius: 16px; padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(59,130,246,.06);
    }
    .trend-card .trend-title {
      font-size: 14px; font-weight: 700; margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
      color: #e0e6f0;
    }
    .trend-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(59,130,246,.06);
    }
    .trend-item:last-child { border-bottom: none; }
    .trend-rank {
      width: 24px; font-size: 13px; font-weight: 700; color: #4a5568;
      text-align: center;
    }
    .trend-rank.top3 { color: #60a5fa; }
    .trend-info { flex: 1; min-width: 0; }
    .trend-info .name {
      font-size: 14px; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: #e0e6f0;
    }
    .trend-info .stat {
      font-size: 12px; color: #4a5568;
    }
    .trend-info .stat .up { color: #f87171; }
    .trend-info .stat .down { color: #4ade80; }
    .trend-heat {
      font-size: 12px; color: #60a5fa; font-weight: 600;
    }

    /* ── Quick insight ── */
    .insight-card {
      background: linear-gradient(135deg, #0f1a2e, #0c1120);
      border-radius: 16px; padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(59,130,246,.1);
      box-shadow: inset 0 0 30px rgba(59,130,246,.03);
    }
    .insight-card .insight-title {
      font-size: 14px; font-weight: 700; margin-bottom: 12px;
      color: #e0e6f0;
    }
    .insight-card p {
      font-size: 13px; color: #6b7a92; line-height: 1.7;
    }
    .insight-card .highlight {
      color: #60a5fa; font-weight: 600;
    }

    /* ── Calendar card ── */
    .cal-card {
      background: #0c1120; border-radius: 16px; padding: 24px;
      margin-bottom: 20px;
      border: 1px solid rgba(59,130,246,.06);
    }
    .cal-card .cal-title {
      font-size: 14px; font-weight: 700; margin-bottom: 12px;
      display: flex; align-items: center; gap: 8px;
      color: #e0e6f0;
    }
    .cal-item {
      display: flex; gap: 12px; padding: 8px 0;
      border-bottom: 1px solid rgba(59,130,246,.06);
    }
    .cal-item:last-child { border-bottom: none; }
    .cal-item .cal-date {
      font-size: 12px; font-weight: 700; color: #60a5fa;
      width: 40px; flex-shrink: 0; text-align: center;
    }
    .cal-item .cal-info { font-size: 13px; color: #6b7a92; }

    /* ── Journal / Daily digest ── */
    .daily-section {
      margin-top: 40px;
    }
    .daily-section .daily-header {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 20px;
    }
    .daily-section .daily-header h3 {
      font-size: 18px; font-weight: 700;
      color: #e0e6f0;
    }
    .daily-section .daily-header .sub {
      font-size: 13px; color: #4a5568;
    }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .sidebar { display: none; }
      .mobile-nav { display: flex !important; }
      .main { padding: 24px 20px 80px; }
      .main-grid { grid-template-columns: 1fr; }
      .side-panel { position: static; }
    }
    @media (max-width: 640px) {
      .hot-hero { padding: 16px; }
      .hot-hero h2 { font-size: 15px !important; }
      .news-card { padding: 14px 16px; }
      .top-bar h1 small { display: block; margin-left: 0; font-size: 12px; }
      .top-bar h1 { font-size: 18px; }
      .top-bar-actions .date-display { font-size: 11px; padding: 4px 10px; }
      .cmp-table { font-size: 10px; }
      .chart-container { padding: 12px; }
      .funnel-row { padding: 6px 10px; }
      .funnel-row .funnel-label { font-size: 11px; }
      .modal { padding: 20px; }
      .stat-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
      .trend-card { padding: 16px; }
      .strat-cal { padding: 12px; font-size: 11px; }
      .strat-cal td, .strat-cal th { padding: 6px 8px; }
      .week-report { padding: 12px 14px; }
      .status-bar { font-size: 11px; padding: 6px 10px; flex-wrap: wrap; }
      .cmp-table td, .cmp-table th { padding: 4px 6px; }
      .ai-brief { padding: 12px 14px; }
      .ai-brief .ab-stat { font-size: 16px; }
      .section-header h3 { font-size: 15px; }
      .cmp-table .cmp-brand span { width: 14px !important; height: 14px !important; font-size: 8px !important; }
    }

    /* ── Edge glow animation ── */
    @keyframes edgeGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(59,130,246,.03), 0 0 40px rgba(59,130,246,.02); }
      50% { box-shadow: 0 0 25px rgba(59,130,246,.06), 0 0 60px rgba(59,130,246,.03); }
    }
    .app::before {
      content: ''; position: fixed; top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,.2), rgba(96,165,250,.4), rgba(59,130,246,.2), transparent);
      z-index: 999; pointer-events: none;
    }
    .app::after {
      content: ''; position: fixed; bottom: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(59,130,246,.15), rgba(96,165,250,.3), rgba(59,130,246,.15), transparent);
      z-index: 999; pointer-events: none;
    }

    /* ── Glow border lines on sides ── */
    .sidebar::after {
      content: ''; position: absolute; top: 0; right: -1px;
      width: 1px; height: 100%;
      background: linear-gradient(180deg, transparent, rgba(59,130,246,.15), rgba(96,165,250,.25), rgba(59,130,246,.15), transparent);
    }

    /* ── Chart styles ── */
    .chart-container {
      background: #0c1120; border-radius: 16px; padding: 20px;
      margin-bottom: 20px; border: 1px solid rgba(59,130,246,.06);
    }
    .chart-container .chart-title {
      font-size: 14px; font-weight: 700; color: #e0e6f0;
      margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
    }
    .chart-container .chart-sub {
      font-size: 11px; color: #4a5568; margin-left: 8px; font-weight: 400;
    }
    .chart-container canvas {
      width: 100%; height: auto; display: block;
      border-radius: 8px; cursor: crosshair;
    }
    .chart-tooltip {
      position: fixed; pointer-events: none; z-index: 100;
      background: #0f1a2e; border: 1px solid rgba(59,130,246,.2);
      border-radius: 10px; padding: 10px 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,.3);
      opacity: 0; transition: opacity .15s;
      min-width: 140px;
    }
    .chart-tooltip.visible { opacity: 1; }
    .chart-tooltip .tt-name { font-size: 13px; font-weight: 700; color: #e0e6f0; }
    .chart-tooltip .tt-brand { font-size: 11px; color: #60a5fa; margin-top: 2px; }
    .chart-tooltip .tt-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 4px; }
    .chart-tooltip .tt-row span { font-size: 11px; color: #6b7a92; }
    .chart-tooltip .tt-row .tt-val { color: #e0e6f0; font-weight: 600; }
    .chart-tooltip .tt-hint { font-size: 10px; color: #4a5568; margin-top: 6px; border-top: 1px solid rgba(148,163,184,.12); padding-top: 5px; }
    .chart-legend {
      display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px;
    }
    .chart-legend span {
      display: flex; align-items: center; gap: 4px;
      font-size: 11px; color: #6b7a92;
    }
    .chart-legend .dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    }

    /* ── Strategy Calendar ── */
    .strat-cal {
      background: #0c1120; border-radius: 16px; padding: 20px;
      margin-bottom: 20px; border: 1px solid rgba(59,130,246,.06);
      overflow-x: auto;
    }
    .strat-cal .sc-title {
      font-size: 14px; font-weight: 700; color: #e0e6f0;
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .strat-cal .sc-month { font-size: 12px; color: #4a5568; margin-left: auto; font-weight: 400; }
    .strat-cal table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .strat-cal th {
      text-align: left; padding: 10px 12px; font-size: 11px; font-weight: 600;
      color: #4a5568; text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 1px solid rgba(59,130,246,.1);
    }
    .strat-cal td {
      padding: 12px; border-bottom: 1px solid rgba(59,130,246,.04);
      vertical-align: middle;
    }
    .strat-cal tr:hover td { background: rgba(59,130,246,.03); }
    .strat-cal .sc-brand-cell {
      display: flex; align-items: center; gap: 8px; font-weight: 600;
    }
    .strat-cal .sc-brand-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .strat-cal .sc-cat {
      font-size: 10px; padding: 2px 10px; border-radius: 100px;
      background: rgba(59,130,246,.08); color: #6b7a92; white-space: nowrap;
    }
    .strat-cal .sc-cat.expansion { background: rgba(34,197,94,.12); color: #4ade80; }
    .strat-cal .sc-cat.product { background: rgba(59,130,246,.12); color: #60a5fa; }
    .strat-cal .sc-cat.social { background: rgba(234,179,8,.12); color: #facc15; }
    .strat-cal .sc-cat.finance { background: rgba(239,68,68,.12); color: #f87171; }
    .strat-cal .sc-date-cell { white-space: nowrap; color: #6b7a92; font-size: 12px; }

    /* ── Trend Chart ── */
    .trend-chart-wrap {

    /* ── Monthly Calendar ── */

    /* ── Brand Universe 2 (业绩份额气泡) ── */
    .universe2 { background: linear-gradient(135deg,#0f1a2e,#141e34); border-radius: 12px; padding: 14px 18px; border: 1px solid rgba(59,130,246,.1); margin-bottom: 16px; }
    .universe2 .u2-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .universe2 .u2-mod { background: rgba(10,15,26,.55); border: 1px solid rgba(59,130,246,.06); border-radius: 10px; padding: 10px 8px; }
    .universe2 .u2-title { font-size: 12px; font-weight: 800; color: #60a5fa; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
    .universe2 .u2-sub { font-size: 9px; color: #4a5568; margin-bottom: 8px; }
    .universe2 .u2-bubbles { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px 10px; min-height: 172px; padding: 14px 6px; }
    .universe2 .u2-bubble { border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #fff; cursor: pointer; position: relative; user-select: none;
      border: 1px solid rgba(255,255,255,.16);
      background:
        radial-gradient(circle at 30% 24%, rgba(255,255,255,.62), rgba(255,255,255,0) 32%),
        radial-gradient(circle at 70% 80%, rgba(0,0,0,.5), rgba(0,0,0,0) 46%),
        linear-gradient(150deg, color-mix(in srgb, var(--bc) 48%, #fff 52%) 0%, color-mix(in srgb, var(--bc) 78%, #fff 6%) 45%, var(--bc) 62%, color-mix(in srgb, var(--bc) 55%, #000 45%) 100%);
      box-shadow:
        0 9px 26px -8px color-mix(in srgb, var(--bc) 70%, transparent),
        0 3px 9px rgba(0,0,0,.38),
        inset 0 2px 2px rgba(255,255,255,.4),
        inset 0 -8px 14px rgba(0,0,0,.28);
      transition: transform .38s cubic-bezier(.34,1.56,.64,1), box-shadow .38s ease;
      will-change: transform; }
    .universe2 .u2-bubble::before { content: ''; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;
      background: linear-gradient(120deg, rgba(255,255,255,.30), rgba(255,255,255,.04) 38%, transparent 55%); }
    .universe2 .u2-bubble::after { content: ''; position: absolute; inset: -7px; border-radius: 50%; pointer-events: none;
      border: 2px solid color-mix(in srgb, var(--bc) 60%, transparent);
      filter: blur(.5px); opacity: 0; transform: scale(.82); transition: all .35s ease; }
    .universe2 .u2-bubble:hover { transform: translateY(-5px) scale(1.16); z-index: 6;
      box-shadow:
        0 18px 40px -10px color-mix(in srgb, var(--bc) 85%, transparent),
        0 5px 12px rgba(0,0,0,.42),
        inset 0 2px 2px rgba(255,255,255,.5),
        inset 0 -8px 16px rgba(0,0,0,.32); }
    .universe2 .u2-bubble:hover::after { opacity: 1; transform: scale(1); }
    .universe2 .u2-bubble:active { transform: translateY(-1px) scale(1.06); }
    .universe2 .u2-bubble.big { animation: u2Float 4.2s ease-in-out infinite; }
    .universe2 .u2-bubble.big:hover { animation: none; }
    .universe2 .u2-bubble .u2-mid { line-height: 1; text-shadow: 0 1px 3px rgba(0,0,0,.55), 0 0 10px rgba(255,255,255,.28); filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
    .universe2 .u2-bubble .u2-lbl { max-width: 68px; font-size: 8px; font-weight: 700; letter-spacing: 1px; line-height: 1; color: rgba(255,255,255,.92); text-shadow: 0 1px 2px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    @keyframes u2Float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .universe2 .u2-bubble.big { animation: none; } .universe2 .u2-bubble { transition: none; } }
    .universe2 .u2-bubble .u2-tip { position: absolute; bottom: 112%; left: 50%; transform: translateX(-50%); background: rgba(10,15,24,.92); backdrop-filter: blur(4px); border: 1px solid color-mix(in srgb, var(--bc) 55%, transparent); color: #e0e6f0; font-size: 10px; font-weight: 500; padding: 3px 9px; border-radius: 7px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease; z-index: 12; text-shadow: none; transform: translateX(-50%) translateY(3px); }

const ENC = new TextEncoder(), DEC = new TextDecoder();
function b64ToU8(s){ const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i); return u; }
async function sha256(s){ const buf=await crypto.subtle.digest('SHA-256', ENC.encode(s)); return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
async function deriveKey(pass){ 
  const km=await crypto.subtle.importKey('raw', ENC.encode(pass), 'PBKDF2', false, ['deriveBits']);
  return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:b64ToU8(LOCK.s), iterations:150000}, km, 256));
}
async function keyFromToken(token, saltB64) {
  const salt = b64ToU8(saltB64);
  const km = await crypto.subtle.importKey('raw', ENC.encode(token), 'PBKDF2', false, ['deriveBits']);
  return crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: 150000 }, km, 256);
}
async function unwrapInvite(entry, token) {
  const kb = await keyFromToken(token, entry.salt);
  const key = await crypto.subtle.importKey('raw', kb, { name: 'AES-GCM' }, false, ['decrypt']);
  const ck = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToU8(entry.iv) }, key, b64ToU8(entry.ct));
  return new Uint8Array(ck);
}
async function onLogin(ev){
  ev.preventDefault();
  const u=(document.getElementById('lgUser').value||'').trim();
  const p=document.getElementById('lgPass').value||'';
  const err=document.getElementById('lgErr');
  err.textContent='解密中…';
  if (!window.isSecureContext){ err.textContent='当前非安全环境(非HTTPS)，WebCrypto不可用，请用 https 访问'; return; }
  if ((await sha256(u))!==LOCK.user || (await sha256(p))!==LOCK.pass){ err.textContent='账号或密码错误，请重试'; return; }
  let keyBits;
  try { keyBits=await deriveKey(p); }
  catch(e){ err.textContent='密钥派生失败：'+e.message; return; }
  let data;
  try { data=await decryptData(keyBits); }
  catch(e){ err.textContent='解密失败：'+e.message; return; }
  try { injectData(data); }
  catch(e){ console.error(e); err.textContent='内容渲染失败，请刷新重试：'+e.message; return; }
  try { sessionStorage.setItem('brew_key', bufToB64(keyBits)); sessionStorage.setItem('brew_auth','1'); } catch(e){}
  err.textContent='';
  dismissMask();
}
function bufToB64(u8){ let s=''; for(const c of u8) s+=String.fromCharCode(c); return btoa(s); }
async function gunzip(u8){
  if (typeof DecompressionStream === 'undefined') throw new Error('浏览器版本过低，请使用新版 Chrome / Edge / Safari');
  const stream = new Blob([u8]).stream().pipeThrough(new DecompressionStream('gzip'));
  const buf = await new Response(stream).arrayBuffer();
  return new Uint8Array(buf);
}
async function decryptData(keyBits){
  const key=await crypto.subtle.importKey('raw', keyBits, {name:'AES-GCM'}, false, ['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToU8(LOCK.iv)}, key, b64ToU8(LOCK.ct));
  if (LOCK.zip === 1) return JSON.parse(DEC.decode(await gunzip(new Uint8Array(pt))));
  return JSON.parse(DEC.decode(pt));
}
function injectData(data){
  document.getElementById('appRoot').innerHTML=data.body;
  const s=document.createElement('script'); s.textContent=data.js; document.body.appendChild(s);
  appMain();
  const r=document.getElementById('appRoot'); if (r) r.classList.add('ready');
  hideSplash();
}
function hideSplash(){ const s=document.getElementById('bootSplash'); if(!s) return; s.style.opacity='0'; setTimeout(()=>{ try{ s.remove(); }catch(e){} }, 240); }
function showLoginMask(){ const m=document.getElementById('loginMask'); if(m) m.style.display='flex'; hideSplash(); }
function dismissMask(){
  const m=document.getElementById('loginMask');
  if (!m) return;
  m.style.setProperty('display','none','important');
  m.hidden=true;
  try { m.remove(); } catch(e){}
}
function appMain(){ try{ switchPage('featured'); initChartTip(); }catch(e){ showBadge('appMain: '+e.message); } }
function logout(){ try{ sessionStorage.removeItem('brew_auth'); sessionStorage.removeItem('brew_key'); }catch(e){} location.reload(); }
function showBadge(msg){ let b=document.getElementById('errBadge'); if(!b){ b=document.createElement('div'); b.id='errBadge'; b.style.cssText='position:fixed;left:10px;bottom:10px;z-index:9999;background:#7f1d1d;color:#fecaca;font-size:12px;padding:8px 12px;border-radius:8px;max-width:60vw;white-space:pre-wrap;'; document.body.appendChild(b);} b.textContent='⚠ '+msg; }
window.addEventListener('error', function(e){ showBadge(e.message + ' @ ' + (e.filename||'').split('/').pop() + ':' + (e.lineno||'')); });
function showMaskMsg(msg) { showLoginMask(); const e = document.getElementById('lgErr'); if (e) e.textContent = msg; }
// 启动：会话密钥 → 邀请链接 → 登录
(async function(){
  let ck = null;
  try { const k = sessionStorage.getItem('brew_key'); if (k) ck = b64ToU8(k); } catch(e){}
  if (!ck) {
    const q = new URLSearchParams(location.search).get('k');
    if (q && q.indexOf('.') > 0) {
      const id = q.slice(0, q.indexOf('.'));
      const token = q.slice(q.indexOf('.') + 1);
      const entry = (typeof INVITES !== 'undefined' ? INVITES : []).find(function(x){ return x.id === id; });
      if (!entry) { showMaskMsg('邀请链接无效，请联系管理员重新获取'); return; }
      if (entry.exp && Date.now() > entry.exp) { showMaskMsg('邀请链接已过期，请联系管理员重新获取'); return; }
      try { ck = await unwrapInvite(entry, token); }
      catch(e){ showMaskMsg('邀请链接无效或已被撤销'); return; }
    }
  }
  if (ck) {
    try {
      injectData(await decryptData(ck));
      try { sessionStorage.setItem('brew_key', bufToB64(ck)); } catch(e){}
      dismissMask();
    } catch(e) { showLoginMask(); }
  } else {
    showLoginMask();
  }
})();
</script>
